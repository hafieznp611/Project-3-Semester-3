<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Profil Interaktif</h1>

    <p id="status-fetch" role="status" aria-live="polite">Memuat profil...</p>
    <button id="tombol-coba-lagi" type="button" hidden>Coba lagi</button>

    <article id="kartu-profil" class="kartu" hidden>

      <div class="header-profil">
        <img id="foto-profil" src="" alt="">
        <div>
          <h2 id="nama-profil"></h2>
          <p id="jabatan-profil"></p>
        </div>
        <button id="tombol-tema" type="button" aria-label="Ganti tema gelap/terang">🌙</button>
      </div>

      <button id="tombol-detail" type="button"
              aria-expanded="false" aria-controls="detail-profil">
        Lihat detail
      </button>
      <div id="detail-profil" class="detail">
        <p id="bio-profil"></p>
        <p id="email-profil"></p>
      </div>

      <h2>Keterampilan</h2>

      <form id="form-keterampilan" novalidate>
        <label for="nama-keterampilan">Nama keterampilan</label>
        <input id="nama-keterampilan" name="keterampilan" autocomplete="off"
               aria-describedby="error-keterampilan" required>
        <small id="error-keterampilan" class="error"></small>

        <button type="submit">Tambah keterampilan</button>
      </form>

      <p id="status-keterampilan" role="status" aria-live="polite"></p>

      <section id="daftar-keterampilan" class="grid" aria-label="Daftar keterampilan"></section>

    </article>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
